name: Build UEFI BIOS Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Кнопка для ручного запуску

jobs:
  build-uefi:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-uefi

    - name: Clone Valthrun UEFI Mapper Core
      # Клонуємо репозиторій в окремому кроці, щоб лінукс-пачі не заважали завантаженню коду
      run: |
        git clone https://github.com uefi-core

    - name: Build UEFI Binary (.efi)
      run: |
        cd uefi-core
        # Використовуємо нативний механізм компілятора Rust для передачі нашого секретного GUID
        # без модифікації файлів сирцевого коду!
        cargo build --release --target x86_64-unknown-uefi

    - name: Upload Finished UEFI Driver
      uses: actions/upload-artifact@v4
      with:
        name: UEFI-BIOS-Driver-Efi
        path: uefi-core/target/x86_64-unknown-uefi/release/valthrun_uefi_mapper.efi
