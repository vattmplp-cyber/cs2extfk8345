name: Build UEFI BIOS Driver

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-uefi:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Clone Valthrun UEFI Mapper Core
        run: |
          git clone https://github.com/Valthrun/valthrun-uefi-mapper.git uefi-core

      - name: Build UEFI Binary (.efi)
        run: |
          cd uefi-core
          cargo build --release --target x86_64-unknown-uefi

      - name: Upload Finished UEFI Driver
        uses: actions/upload-artifact@v4
        with:
          name: UEFI-BIOS-Driver-Efi
          path: uefi-core/target/x86_64-unknown-uefi/release/*.efi
